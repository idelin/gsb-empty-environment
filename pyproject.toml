[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitemporal-version-index"
version = "0.1.0"
description = "双时间轴（业务时间/录入时间）追加式版本索引，支持历史重放与安全回收"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["bitemporal"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
